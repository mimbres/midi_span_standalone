[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-span-standalone"
version = "0.1.0"
description = "Standalone SpanSynth V3 SQ conditioning and FlowAMT endpoint MIDI codecs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "AnySynth contributors"}]
dependencies = ["numpy>=1.26", "mido>=1.3"]

[tool.setuptools]
packages = ["midi_span"]
